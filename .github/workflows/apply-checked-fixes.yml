name: Apply checked curriculum fixes
on:
  push:
    branches: [codex/spica-aligned-lessons-v1.1.0]
    paths: [.github/workflows/apply-checked-fixes.yml]
permissions:
  contents: write
jobs:
  verified-fixes:
    if: github.ref == 'refs/heads/codex/spica-aligned-lessons-v1.1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/spica-aligned-lessons-v1.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply reviewed fixes and remove this one-time workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/python/caya_assessment.py')
          s = p.read_text()
          old = '[min(starts), max(ends), track.get("cursor")], [0, 8, 8]'
          assert old in s
          s = s.replace(old, '[min(starts), max(ends)], [0, 8]')
          s = s.replace('        for track in active:\n', '        check("曲全体も8拍", song["length_beats"], 8)\n        for track in active:\n')
          s = s.replace('        exec(compile(tree, "student_code.py", "exec"), namespace)', '        try:\n            exec(compile(tree, "student_code.py", "exec"), namespace)\n        except BaseException as exc:\n            exc._caya_stdout = stdout.getvalue()\n            exc._caya_stderr = stderr.getvalue()\n            raise')
          s = s.replace('payload.update(errorType=type(exc).__name__, error=str(exc)[:2000], traceback=traceback.format_exc()[-8000:])', 'payload.update(errorType=type(exc).__name__, error=str(exc)[:2000], traceback=traceback.format_exc()[-8000:],\n                       stdout=getattr(exc, "_caya_stdout", ""), stderr=getattr(exc, "_caya_stderr", ""))')
          p.write_text(s)
          p = Path('assets/js/practice-app.js'); s = p.read_text()
          old = 'persist(); const ok = store.import(data);\n      navigate'
          assert old in s
          s = s.replace(old, 'persist(); const ok = store.import(data);\n      state.record = null; // Do not save the old editor over the newly imported record.\n      navigate')
          p.write_text(s)
          p = Path('index.html'); s = p.read_text()
          s = s.replace('コードを読み、変え、実行する。', 'コードを読み、書き、確かめる。')
          s = s.replace('変数、リスト、繰り返し、条件分岐、乱数、関数を、音の変化と結び付けて学びます。', 'SPICAに沿って変数、リスト、繰り返し、条件分岐、関数を学び、学生自身のコードを音とデータで確かめます。')
          s = s.replace('<strong>変える</strong><p>音名、テンポ、回数、条件などを一か所ずつ変更します。</p>', '<strong>書く</strong><p>指示とヒントを読み、式、繰り返し、条件分岐、関数を自分で書きます。</p>')
          s = s.replace('最初は自分で定義した小さな関数から始めます。', '最初は変数と短い音から始めます。')
          s = s.replace('v1.0.0', 'v1.1.0')
          p.write_text(s)
          Path('.github/workflows/apply-checked-fixes.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/python/caya_assessment.py assets/js/practice-app.js index.html .github/workflows/apply-checked-fixes.yml
          git commit -m 'Fix exported track checks, imported draft restoration and preserve error output'
          git push origin HEAD:codex/spica-aligned-lessons-v1.1.0
      - name: Static and unit checks
        run: npm test
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Real browser and Pyodide checks
        run: npm run test:browser
      - name: Package final tracked source
        if: always()
        run: |
          git rev-parse HEAD > checked-commit.txt
          python3 scripts/package-release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-as-you-are-checked-source
          path: |
            dist/compose-as-you-are-v1.1.0.zip
            browser-results
            checked-commit.txt
          retention-days: 30
